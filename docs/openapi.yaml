openapi: 3.0.3
info:
  title: Task Management API
  version: 1.0.0
  description: Task, project, comment, and user management REST API.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Register' }
      responses:
        '201': { description: User created }
        '400': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      summary: Login and receive a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties: { email: { type: string, format: email }, password: { type: string } }
      responses:
        '200': { description: Access token issued }
        '401': { $ref: '#/components/responses/Error' }
  /projects:
    get: { summary: List projects, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/page_size' }], responses: { '200': { description: Paged projects } } }
    post: { summary: Create project, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }, responses: { '201': { description: Created } } }
  /projects/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get project, security: [{ bearerAuth: [] }], responses: { '200': { description: Project } } }
    put: { summary: Update project, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }, responses: { '200': { description: Updated } } }
    delete: { summary: Soft-delete project, security: [{ bearerAuth: [] }], responses: { '204': { description: Deleted } } }
  /tasks:
    get: { summary: List tasks, security: [{ bearerAuth: [] }], responses: { '200': { description: Paged tasks } } }
    post: { summary: Create task, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }, responses: { '201': { description: Created } } }
  /tasks/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get task, security: [{ bearerAuth: [] }], responses: { '200': { description: Task } } }
    put: { summary: Update task, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }, responses: { '200': { description: Updated } } }
    delete: { summary: Soft-delete task, security: [{ bearerAuth: [] }], responses: { '204': { description: Deleted } } }
  /comments:
    get: { summary: List comments, security: [{ bearerAuth: [] }], responses: { '200': { description: Paged comments } } }
    post: { summary: Create comment, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }, responses: { '201': { description: Created } } }
  /comments/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get comment, security: [{ bearerAuth: [] }], responses: { '200': { description: Comment } } }
    put: { summary: Update comment, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }, responses: { '200': { description: Updated } } }
    delete: { summary: Soft-delete comment, security: [{ bearerAuth: [] }], responses: { '204': { description: Deleted } } }
  /users:
    get: { summary: List users (admin), security: [{ bearerAuth: [] }], responses: { '200': { description: Users } } }
    post: { summary: Create user (admin), security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Register' } } } }, responses: { '201': { description: Created } } }
  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { summary: Get own user or any user (admin), security: [{ bearerAuth: [] }], responses: { '200': { description: User } } }
    put: { summary: Update own user or any user (admin), security: [{ bearerAuth: [] }], responses: { '200': { description: Updated } } }
    delete: { summary: Delete own user or any user (admin), security: [{ bearerAuth: [] }], responses: { '204': { description: Deleted } } }
  /health:
    get: { summary: Health check, responses: { '200': { description: Healthy } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: integer } }
    page: { name: page, in: query, schema: { type: integer, default: 1 } }
    page_size: { name: page_size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { type: object, properties: { error: { type: object, properties: { code: { type: string }, message: { type: string } } } } }
  schemas:
    Register:
      type: object
      required: [name, email, password]
      properties: { name: { type: string }, email: { type: string, format: email }, password: { type: string, minLength: 8 } }
    Project:
      type: object
      required: [name]
      properties: { name: { type: string }, description: { type: string } }
    Task:
      type: object
      required: [title, project_id]
      properties: { title: { type: string }, description: { type: string }, status: { type: string, enum: [todo, in_progress, done, blocked] }, priority: { type: string, enum: [low, medium, high, urgent] }, project_id: { type: integer } }
    Comment:
      type: object
      required: [body, task_id]
      properties: { body: { type: string }, task_id: { type: integer } }
